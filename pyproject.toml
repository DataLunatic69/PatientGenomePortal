[project]
name = "patientgenomeportal"
version = "0.1.0"
description = "Patient-facing genomic portal using AlphaGenome, LangGraph, and Gemini"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # ── AlphaGenome ──────────────────────────────────────────────────────────
    "alphagenome>=0.6.0",
    # ── FastAPI + server ──────────────────────────────────────────────────────
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.1.0",
    # ── LangGraph + LangChain ─────────────────────────────────────────────────
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.0.0",
    # ── Google Gemini ─────────────────────────────────────────────────────────
    "google-generativeai>=0.8.0",
    # ── Data & genomics ───────────────────────────────────────────────────────
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "pyarrow>=17.0.0",
    "biopython>=1.84",
    "cyvcf2>=0.31.0",
    # ── Database ──────────────────────────────────────────────────────────────
    "sqlmodel>=0.0.22",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    # ── Supabase storage ──────────────────────────────────────────────────────
    "supabase>=2.9.0",
    # ── Config & validation ───────────────────────────────────────────────────
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    # ── Serialization / reporting ─────────────────────────────────────────────
    "orjson>=3.10.0",
    "jinja2>=3.1.0",
    "weasyprint>=62.0",
    # ── Observability ─────────────────────────────────────────────────────────
    "structlog>=24.4.0",
    "sentry-sdk[fastapi]>=2.14.0",
    "arq>=0.27.0",
    "redis>=5.3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "ipykernel>=6.29.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
